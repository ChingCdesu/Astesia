[package]
name = "astesia"
version = "1.0.5"
description = "A database management application"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.85"
default-run = "astesia"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "mysql", "postgres", "sqlite", "any", "chrono", "json", "uuid", "bigdecimal", "ipnetwork", "mac_address", "bit-vec"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls", "chrono"] }
mongodb = "3"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
tokio-util = { version = "0.7", features = ["compat"] }
dirs = "6"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
rust_xlsxwriter = "0.95"
rmcp = { version = "=2.2.0", features = ["elicitation", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars = "=1.2.1"
sqlparser = "=0.62.0"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tauri-plugin-shell = "2"
