[package]
name = "astesia"
version = "1.0.9"
description = "A database management application"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.98.0"
default-run = "astesia"

[lib]
name = "app_lib"

[dependencies]
gpui-kit = { version = "=0.6.0", features = ["tree-sitter-sql"] }
lsp-types = "=0.97.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "mysql", "postgres", "sqlite", "any", "chrono", "json", "uuid", "bigdecimal", "ipnetwork", "mac_address", "bit-vec"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls", "chrono"] }
mongodb = "3"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
fs4 = { version = "1", features = ["sync"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
tokio-util = { version = "0.7", features = ["compat"] }
dirs = "6"
rust_xlsxwriter = { version = "0.95", features = ["constant_memory"] }
rmcp = { version = "=2.2.0", features = ["elicitation", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars = "=1.2.1"
sqlparser = "=0.62.0"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
ring = "=0.17.14"
zeroize = "=1.8.2"
tempfile = "3"

[dev-dependencies]
gpui-kit = { version = "=0.6.0", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }
