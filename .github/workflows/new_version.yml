name: New Version

on:
  workflow_dispatch:

jobs:
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        id: bump
        run: |
          current=$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml)
          IFS=. read -r major minor patch <<< "${current%%-*}"
          if [[ -z "$major" || -z "$minor" || -z "$patch" ]]; then
            echo "Unexpected version format: $current" >&2
            exit 1
          fi
          version="$major.$minor.$((patch + 1))"
          VERSION="$version" perl -0pi -e \
            's/(\[package\]\nname = "astesia"\nversion = ")[^"]+/$1$ENV{VERSION}/' \
            src-tauri/Cargo.toml
          VERSION="$version" perl -0pi -e \
            's/(\[\[package\]\]\nname = "astesia"\nversion = ")[^"]+/$1$ENV{VERSION}/' \
            src-tauri/Cargo.lock
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | head -n 1)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE=""
          fi
          DATE=$(date -u +%Y-%m-%d)
          {
            echo "## v${VERSION} - ${DATE}"
            echo ""
            if [ -n "$RANGE" ]; then
              git log "$RANGE" --pretty=format:'- %s (%h)' --no-merges
            else
              git log --pretty=format:'- %s (%h)' --no-merges
            fi
            echo ""
            echo ""
          } > /tmp/new_entry.md

          if [ -f CHANGELOG.md ]; then
            { cat /tmp/new_entry.md; echo ""; cat CHANGELOG.md; } > /tmp/changelog.md
          else
            { echo "# Changelog"; echo ""; cat /tmp/new_entry.md; } > /tmp/changelog.md
          fi
          mv /tmp/changelog.md CHANGELOG.md

      - name: Commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.toml src-tauri/Cargo.lock CHANGELOG.md
          git commit -m "release: ${VERSION}"
          git tag "v${VERSION}"
          git push origin main
          git push origin "v${VERSION}"
