name: Native packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: astesia-linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: astesia-windows-x64
          - platform: macos-15
            target: aarch64-apple-darwin
            artifact: astesia-macos-arm64
          - platform: macos-15
            target: x86_64-apple-darwin
            artifact: astesia-macos-x64

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            g++ \
            gcc \
            libasound2-dev \
            libfontconfig-dev \
            libgit2-dev \
            libglib2.0-dev \
            libssl-dev \
            libva-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libzstd-dev \
            libsqlite3-dev \
            make

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Package Linux
        if: startsWith(matrix.platform, 'ubuntu')
        run: scripts/package-linux.sh "${{ matrix.target }}"

      - name: Package macOS
        if: startsWith(matrix.platform, 'macos')
        run: scripts/package-macos.sh "${{ matrix.target }}"

      - name: Package Windows
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: scripts/package-windows.ps1 -Target "${{ matrix.target }}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/package/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --repo "${GITHUB_REPOSITORY}"
          --draft
          --title "Astesia ${GITHUB_REF_NAME}"
          --notes "Internal native packages."
          artifacts/**/*
